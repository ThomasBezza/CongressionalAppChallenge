<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light"><title>Rehearsal room</title>
  <link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header class="masthead"><a href="/" class="wordmark">Rehearsal Room</a></header>
    <div class="status-row"><p id="connection" class="connection" role="status" hidden>Not connected</p><p id="voice-status" class="connection voice" hidden></p></div>
    <p id="pending" class="small" role="status" hidden></p>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="voice-panel" class="panel voice-panel" aria-label="Room audio" hidden></section>
    <div id="app"></div>
    <div id="remote-audio" aria-hidden="true"></div>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <footer>Keep this page open while you practice. Nothing you say is recorded or transcribed. This is a working preview.</footer>
  </main>
</body>
</html>
